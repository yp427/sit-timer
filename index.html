<style>
/* VOICE quiet, unhurried, night
   IDEA a meditation hall's bell shelf: you pick an instrument, strike it, sit
   PICTURE the bronze instruments carousel
   COLOUR near-black ground, black pills, white primary, one amber accent
   TYPE Sora throughout, light for the countdown */
:root{color-scheme:dark;--bg:#191919;--ink:#808080;--dim:#666;--off:#333;--amber:#f2a51f;--pill:#000}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Sora,system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #fff;outline-offset:2px}
.app{max-width:430px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:5;background:#000;border-bottom:1px solid #3a3a3a;padding-top:max(44px,env(safe-area-inset-top));height:calc(60px + max(44px,env(safe-area-inset-top)));display:flex;align-items:flex-end;justify-content:center}
.tabs{display:flex;gap:58px}
.tab{font-family:Lora,Georgia,serif;font-weight:600;font-size:16.5px;color:var(--dim);padding:0 2px 12px;border-bottom:3px solid transparent}
.tab[aria-selected=true]{color:#fff;border-color:#fff}
.more{position:absolute;right:max(14px,calc(50% - 201px));bottom:10px;width:44px;height:44px;display:grid;place-items:center}
.view{display:none;flex-direction:column;align-items:center;flex:1;padding-bottom:max(28px,env(safe-area-inset-bottom))}
.view.on{display:flex}
.lbl{margin:34px 0 0;font-size:14px;font-weight:300;color:#8c8c8c;text-align:center}
.car{display:flex;gap:45px;width:100%;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px calc(50% - 75px) 0;scrollbar-width:none;height:140px;align-items:center}
.car::-webkit-scrollbar{display:none}
.bell{flex:0 0 150px;height:130px;scroll-snap-align:center;position:relative;display:grid;place-items:center}
.bell svg{width:140px;height:96px;overflow:visible}
.bell[data-id=gong] svg{width:122px;height:122px}
.bell .nm{position:absolute;left:-20px;right:-20px;top:50%;transform:translateY(-50%);text-align:center;font-size:13.5px;font-weight:300;color:#fff;text-shadow:0 0 1.5px rgba(0,0,0,.75),0 0 5px rgba(0,0,0,.65),0 0 14px rgba(0,0,0,.55);white-space:nowrap;pointer-events:none}
.bell.sel .nm{font-weight:300;font-size:14.5px}
.bell .nm{-webkit-font-smoothing:antialiased}
.dots{display:flex;gap:14px;margin-top:4px}
.dots button{width:36px;height:36px;border-radius:50%;font-size:14px;color:var(--dim);border:1.5px solid transparent}
.dots button[aria-pressed=true]{border-color:#fff;color:#fff}
.pills{width:calc(100% - 46px);max-width:344px;display:flex;flex-direction:column;gap:9px;margin-top:28px;transition:opacity .5s}
.pill{height:44px;border-radius:22px;background:var(--pill);display:flex;align-items:center;justify-content:space-between;padding:0 22px 0 30px;font-size:14.5px;font-weight:200;color:var(--ink);width:100%}
.pill .v{display:flex;align-items:center;gap:10px}
.pill .v.off{color:var(--off)}
.pill .v.off path{stroke:#4d4d4d}
.pill select{appearance:none;-webkit-appearance:none;background:none;border:0;text-align:right;font-size:14.5px;font-weight:200;color:var(--ink);padding-right:2px}
.streak{margin-top:36px;color:var(--amber);font-size:14.5px;font-weight:300;display:flex;align-items:baseline;gap:6px;min-height:44px;align-items:center}
.streak em{font-style:normal;font-family:Sora,system-ui,sans-serif;font-style:italic;font-weight:500;font-size:18px}
.bottom{width:100%;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-top:14px}
.today{justify-self:start;margin-left:42px;height:44px;padding:0 16px;border-radius:22px;background:#2b2b2b;display:flex;align-items:center;font-size:13.5px;white-space:nowrap}
.go{width:68px;height:68px;border-radius:50%;background:#fff;color:#000;font-family:Sora,system-ui,sans-serif;font-weight:600;font-size:14.5px}
#goBtn{display:grid;place-items:center}
#goBtn svg{margin-left:4px}
.go:active{transform:scale(.96)}
.big{font-weight:300;font-size:clamp(64px,20vw,78px);color:#f2f2f2;font-variant-numeric:tabular-nums;letter-spacing:1px;line-height:1;margin:22px 0 0;text-align:center}
.bar{width:68%;height:3px;border-radius:2px;background:#3a3a3a;margin-top:26px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#f2f2f2}
.col{width:100%;display:flex;flex-direction:column;align-items:center}
.run .idle-only{display:none!important}
.view:not(.run) .run-only{display:none!important}
.run .pills{opacity:.3;pointer-events:none}
.amber{color:var(--amber);font-size:16px;min-height:44px;margin-top:36px}
/* log */
.mnav{display:flex;align-items:center;gap:18px;margin-top:22px}
.mnav button{width:44px;height:44px;display:grid;place-items:center}
.mnav span{font-size:14px;font-weight:300;color:#8c8c8c;min-width:130px;text-align:center}
.cal{width:calc(100% - 68px);max-width:322px;margin-top:6px}
.wk,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));justify-items:center}
.wk{font-size:11px;color:var(--dim);margin-bottom:8px}
.days{row-gap:6px}
.day{width:36px;height:36px;border-radius:50%;font-size:13px;color:var(--ink)}
.day.has{background:#fff;color:#000}
.day.now{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--amber)}
.day:disabled{color:#555;cursor:default}
.seg{display:flex;gap:6px;margin-top:22px}
.seg button{height:34px;padding:0 13px;border-radius:17px;font-size:13px;color:var(--dim);border:1.5px solid transparent}
.seg button[aria-pressed=true]{border-color:#fff;color:#fff}
/* sheets */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .5s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:min(430px,100%);transform:translate(-50%,105%);transition:transform .5s cubic-bezier(.2,.8,.2,1);z-index:21;background:rgba(32,32,32,.72);-webkit-backdrop-filter:blur(26px) saturate(160%);backdrop-filter:blur(26px) saturate(160%);border-top:1px solid rgba(255,255,255,.12);border-radius:22px 22px 0 0;padding:12px 23px max(28px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;max-height:88dvh;overflow-y:auto}
.sheet.on{transform:translate(-50%,0)}
.grab{width:38px;height:5px;border-radius:3px;background:#5a5a5a;margin-bottom:20px}
.sheet h2{margin:0 0 20px;font-family:Sora,system-ui,sans-serif;font-weight:600;font-size:15.5px;color:#fff;text-align:center}
.glass{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:100%}
.tile{height:136px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:13px}
.tile svg{width:112px;height:77px;overflow:visible}
.tile[data-id=gong] svg{width:84px;height:84px}
.tile[aria-pressed=true]{box-shadow:inset 0 0 0 1.5px #fff;color:#fff}
.timeEdit{display:flex;flex-direction:column;align-items:center;gap:18px}
.timeEdit .big{margin:0;cursor:pointer;background:none;border:0}
.timeEdit input{width:200px;text-align:center;font-weight:300;font-size:64px;background:transparent;border:0;border-bottom:1px solid #555;color:#fff}
.pm{display:flex;gap:28px}
.round{width:52px;height:52px;border-radius:50%;font-size:26px;font-weight:300;color:#fff;display:grid;place-items:center}
.presets{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.presets button,.chips button{min-width:48px;height:44px;padding:0 14px;border-radius:22px;font-size:14px}
.presets button[aria-pressed=true],.chips button[aria-pressed=true]{background:rgba(255,255,255,.88);color:#000}
.chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.done{margin-top:24px}
.list{width:100%;display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.row{height:48px;border-radius:24px;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 22px;font-size:14px}
.row button{height:36px;padding:0 14px;border-radius:18px;font-size:13.5px;color:#ddd}
.add{width:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:8px}
.add input,.add select,.sheet textarea{height:48px;border-radius:24px;padding:0 18px;font-size:16px;color:#fff;width:100%;-webkit-appearance:none;appearance:none}
.add .full{grid-column:1/-1}
.sheet textarea{height:110px;border-radius:18px;padding:12px 16px;resize:none;font-size:13px}
.wide{width:100%;height:48px;border-radius:24px;font-size:14px;color:#fff;margin-top:8px}
.note{font-size:13px;color:#9a9a9a;text-align:center;margin:6px 0 0;min-height:18px}
.fin{position:fixed;inset:0;z-index:30;background:rgba(10,10,10,.82);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:30px;text-align:center;opacity:0;pointer-events:none;transition:opacity .5s}
.fin.on{opacity:1;pointer-events:auto}
.fin p{margin:0}
.fin .msg{font-style:normal;font-family:Sora,system-ui,sans-serif;font-style:italic;font-weight:600;font-size:clamp(28px,8vw,36px);color:#fff;line-height:1.15;text-wrap:balance;max-width:320px}
.fin .sub{font-size:14px;color:#a3a3a3}
.fin .go{margin-top:20px}
/* running screen */
.rs{position:fixed;inset:0;z-index:15;background:#000;opacity:0;pointer-events:none;transition:opacity .5s}
.rs.on{opacity:1;pointer-events:auto}
.rs-in{position:relative;max-width:430px;height:100%;margin:0 auto}
.rs-mid{position:absolute;left:0;right:0;top:48%;transform:translateY(-50%);text-align:center}
.rs-time{margin:0;font-family:Sora,system-ui,sans-serif;font-weight:200;font-size:64px;line-height:1;color:#fff;font-variant-numeric:tabular-nums;letter-spacing:1px}
.rs-pp{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(max(14px,env(safe-area-inset-bottom) - 10px) + 132px);width:72px;height:72px;display:grid;place-items:center}
.rs-act{position:absolute;left:23px;right:23px;bottom:max(14px,calc(env(safe-area-inset-bottom) - 10px));display:flex;flex-direction:column;align-items:center;gap:6px;visibility:hidden}
.rs.paused .rs-act{visibility:visible}
.rs-finish{width:100%;height:49px;border-radius:16px;background:#fff;color:#191919;font-weight:200;font-size:14.5px}
.rs-discard{height:44px;padding:0 16px;font-weight:200;font-size:14.5px;color:#fff}
@media (prefers-reduced-motion:reduce){.sheet,.scrim,.fin,.pills,.rs{transition:none}}
</style>
</head>

AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA==';
let keepEl,keepT;
/* iOS: a playing <audio> element moves the page into the playback audio session, so Web Audio ignores the silent switch */
function keepAlive(ms){
 try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
 if(!keepEl){keepEl=document.createElement('audio');keepEl.src=SILENT;keepEl.loop=true;keepEl.setAttribute('playsinline','');keepEl.preload='auto';document.body.appendChild(keepEl)}
 const p=keepEl.play();if(p&&p.catch)p.catch(()=>{});
 clearTimeout(keepT);if(ms)keepT=setTimeout(()=>{if(!run)keepEl.pause()},ms);
}
function ctx(){keepAlive(run?0:9000);if(!ac){const C=window.AudioContext||window.webkitAudioContext;ac=new C()}if(ac.state==='suspended')ac.resume();return ac}
const VOICES={
 shurong:{f:220,p:[[1,1,9],[2.71,.42,6],[5.15,.18,3.5],[8.2,.07,2]]},
 /* Basu: small, thin-walled Tibetan bowl, the highest ring of the set. Bowl overtones sit near 2.7x and 5.2x the fundamental; small bowls decay faster */
 basu:{f:640,p:[[1,1,7],[2.74,.42,4.5],[5.18,.17,2.6],[8.3,.06,1.4]]},
 ombu:{f:330,p:[[1,1,8],[2.65,.38,5],[4.9,.16,3]]},
 gong:{f:98,p:[[1,1,10],[1.52,.55,8],[2.17,.42,6.5],[2.94,.3,5],[3.83,.2,4],[4.71,.12,3]],noise:1},
 wood:{f:780,p:[[1,1,.2],[2.32,.3,.09]],click:1}
};
let noiseBuf;
function noise(c){if(!noiseBuf){noiseBuf=c.createBuffer(1,c.sampleRate*2,c.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}return noiseBuf}
function strike(id,t,bus){
 const c=ctx(),v=VOICES[id];if(!v)return;
 const out=c.createGain();out.gain.value=.8;out.connect(bus||c.destination);
 for(const[r,a,dec]of v.p){
  const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=v.f*r;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(a*.22,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dec);
  o.connect(g);g.connect(out);o.start(t);o.stop(t+dec+.1);
 }
 if(v.noise){const n=c.createBufferSource();n.buffer=noise(c);n.loop=true;const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=420;f.Q.value=.7;const g=c.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.05,t+.5);g.gain.exponentialRampToValueAtTime(.0001,t+5);n.connect(f);f.connect(g);g.connect(out);n.start(t);n.stop(t+5.2)}
 if(v.click){const n=c.createBufferSource();n.buffer=noise(c);const f=c.createBiquadFilter();f.type='highpass';f.frequency.value=1800;const g=c.createGain();g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.0001,t+.03);n.connect(f);f.connect(g);g.connect(out);n.start(t);n.stop(t+.05)}
}
function ring(id,n,t0,bus){if(id==='none')return;const c=ctx();t0=Math.max(t0||0,c.currentTime+.03);const gap=id==='wood'?.45:3;for(let i=0;i<n;i++)strike(id,t0+i*gap,bus)}
function newEndBus(){if(endBus){try{endBus.disconnect()}catch(e){}}const c=ctx();endBus=c.createGain();endBus.connect(c.destination);return endBus}
function killEndBus(){if(endBus){try{endBus.disconnect()}catch(e){}endBus=null}}
function killStartBus(){if(startBus){try{startBus.disconnect()}catch(e){}startBus=null}}

/* ---------- carousel + pickers ---------- */
const NONE_ART='<svg width="140" height="96" viewBox="0 0 140 96" aria-hidden="true"><circle cx="70" cy="48" r="42" fill="#2a2a2c"/><g fill="#000"><path d="M60 37 L84 32 L84 58 L80 58 L80 38.5 L64 42 L64 62 L60 62 Z"/><ellipse cx="56" cy="62" rx="6.5" ry="5" transform="rotate(-18 56 62)"/><ellipse cx="76" cy="58" rx="6.5" ry="5" transform="rotate(-18 76 58)"/></g><path d="M52 30 L89 67" stroke="#2a2a2c" stroke-width="9" stroke-linecap="round"/><path d="M52 30 L89 67" stroke="#000" stroke-width="4.5" stroke-linecap="round"/></svg>';
const art=id=>id==='none'?NONE_ART:$('art-'+id).innerHTML;
const STEP=195;
const car=$('car');
car.innerHTML=SOUNDS.map((s,i)=>`<button class="bell" data-id="${s.id}" data-i="${i}" aria-label="${s.name}">${art(s.id)}${s.id==='none'?'':`<span class="nm">${s.name}</span>`}</button>`).join('');
function markCar(){
 const i=SOUNDS.findIndex(s=>s.id===S.settings.startBell);
 car.querySelectorAll('.bell').forEach(b=>{b.classList.toggle('sel',+b.dataset.i===i);b.setAttribute('aria-pressed',+b.dataset.i===i)});
}
let scT;
car.addEventListener('scroll',()=>{clearTimeout(scT);scT=setTimeout(()=>{const i=Math.max(0,Math.min(SOUNDS.length-1,Math.round(car.scrollLeft/STEP)));if(SOUNDS[i].id!==S.settings.startBell){S.settings.startBell=SOUNDS[i].id;save();markCar()}},120)},{passive:true});
car.addEventListener('click',e=>{const b=e.target.closest('.bell');if(!b)return;const i=+b.dataset.i;S.settings.startBell=SOUNDS[i].id;save();markCar();car.scrollTo({left:i*STEP,behavior:'smooth'});ring(SOUNDS[i].id,1)});

$('endGrid').innerHTML=['shurong','gong','basu','wood','ombu'].map(id=>SOUNDS.find(s=>s.id===id)).map(s=>`<button class="tile glass" data-id="${s.id}">${art(s.id)}<span>${s.name}</span></button>`).join('')+`<button class="tile glass" data-id="none"><span>None</span></button>`;
$('endGrid').addEventListener('click',e=>{const b=e.target.closest('.tile');if(!b)return;S.settings.endBell=b.dataset.id;save();paintTimer();ring(b.dataset.id,1)});

const PRE=[5,10,15,20,30];
$('presets').innerHTML=PRE.map(m=>`<button class="glass" data-m="${m}">${m}</button>`).join('');
$('presets').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;setDur(+b.dataset.m)});
function setDur(m){S.settings.dur=Math.max(1,Math.min(300,Math.round(m)||1));save();paintTimer()}
$('durMinus').onclick=()=>setDur(S.settings.dur-1);
$('durPlus').onclick=()=>setDur(S.settings.dur+1);
$('durBig').onclick=()=>{const i=$('durInput');$('durBig').hidden=true;i.hidden=false;i.value=S.settings.dur;i.focus();i.select()};
function commitDur(){const i=$('durInput');if(i.hidden)return;setDur(+i.value);i.hidden=true;$('durBig').hidden=false}
$('durInput').addEventListener('blur',commitDur);
$('durInput').addEventListener('keydown',e=>{if(e.key==='Enter')commitDur()});

const COUNTS=[0,5,10,15];
$('countChips').innerHTML=COUNTS.map(s=>`<button class="glass" data-s="${s}">${s?s+' sec':'Off'}</button>`).join('');
$('countChips').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.settings.countIn=+b.dataset.s;save();paintTimer()});

/* ---------- sheets ---------- */
let openSheet=null;
function show(id){commitDur();if(openSheet)openSheet.classList.remove('on');openSheet=$(id);openSheet.classList.add('on');$('scrim').classList.add('on')}
function hide(){commitDur();if(openSheet)openSheet.classList.remove('on');openSheet=null;$('scrim').classList.remove('on')}
$('scrim').onclick=hide;
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=hide);
$('pDur').onclick=()=>show('shDur');
$('pCount').onclick=()=>show('shCount');
$('pEnd').onclick=()=>show('shEnd');
$('moreBtn').onclick=()=>{$('bkNote').textContent='';show('shSet')};

/* ---------- data helpers ---------- */
const byDay=()=>{const m={};for(const s of S.sessions)(m[s.date]=m[s.date]||[]).push(s);return m};
function streak(){const m=byDay();const d=new Date();if(!m[dkey(d)])d.setDate(d.getDate()-1);let n=0;while(m[dkey(d)]){n++;d.setDate(d.getDate()-1)}return n}
function streakHTML(){const n=streak();return n?`<em>${n}-day</em> streak`:'No streak yet'}
const todayMin=()=>S.sessions.filter(s=>s.date===dkey(new Date())).reduce((a,s)=>a+s.min,0);
function addSession(date,min,cat){S.sessions.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),date,min,cat});save()}

/* ---------- timer ---------- */
let run=null,tickT=null,wake=null;
function paintTimer(){
 const st=S.settings;
 $('vDur').textContent=fmt(st.dur*60);$('durBig').textContent=fmt(st.dur*60);
 $('vCount').textContent=st.countIn?st.countIn+' sec':'Off';
 $('vEnd').textContent=nameOf(st.endBell);
 $('vCountW').classList.toggle('off',!st.countIn);$('vEndW').classList.toggle('off',st.endBell==='none');
 $('presets').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.m===st.dur));
 $('countChips').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.s===st.countIn));
 $('endGrid').querySelectorAll('.tile').forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===st.endBell));
 $('streakT').innerHTML=streakHTML()+' <span aria-hidden="true" style="letter-spacing:-3px">›››</span>';
 markCar();
}
async function lock(){try{wake=await navigator.wakeLock.request('screen')}catch(e){wake=null}}
function unlock(){try{wake&&wake.release()}catch(e){}wake=null}
function scheduleEnd(secFromNow){const c=ctx();ring(S.settings.endBell,1,c.currentTime+secFromNow,newEndBus())}
function start(){
 const c=ctx(),st=S.settings,now=Date.now(),ci=st.countIn;
 run={phase:ci?'count':'sit',countEnd:now+ci*1000,start:now+ci*1000,end:now+ci*1000+st.dur*60000,total:st.dur*60000,left:0};
 killStartBus();startBus=c.createGain();startBus.connect(c.destination);ring(st.startBell,1,c.currentTime+ci,startBus); scheduleEnd(ci+st.dur*60);
 keepAlive(0);lock();$('rs').classList.remove('paused');$('rs').classList.add('on');tick();tickT=setInterval(tick,250);
}
const clk=sec=>{sec=Math.max(0,Math.ceil(sec));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h?h+':'+pad(m)+':'+pad(s):pad(m)+':'+pad(s)};
const PAUSE_ICO='<svg width="28" height="35" viewBox="0 0 26 32" aria-hidden="true"><rect x="1" y="1" width="7.5" height="30" rx="3.75" fill="#fff"/><rect x="17.5" y="1" width="7.5" height="30" rx="3.75" fill="#fff"/></svg>';
const PLAY_ICO='<svg width="34" height="41" viewBox="0 0 30 36" aria-hidden="true"><path d="M4 3.2C4 1.6 5.7.6 7.1 1.4l20.4 13.9c1.3.9 1.3 2.6 0 3.4L7.1 32.6C5.7 33.4 4 32.4 4 30.8z" fill="#fff" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"/></svg>';
let ppState='';
function tick(){
 if(!run)return;const now=Date.now();
 if(run.phase==='count'&&now>=run.countEnd)run.phase='sit';
 let txt;
 if(run.phase==='count'){txt=clk((run.countEnd-now)/1000)}
 else{
  const left=run.phase==='paused'?run.left:run.end-now;
  if(left<=0){finish(true);return}
  txt=clk(left/1000);
 }
 $('clock').textContent=txt;
 const p=run.phase==='paused'?'play':'pause';
 if(p!==ppState){ppState=p;$('ppBtn').innerHTML=p==='play'?PLAY_ICO:PAUSE_ICO;$('ppBtn').setAttribute('aria-label',p==='play'?'Resume':(run.phase==='count'?'Cancel':'Pause'))}
 $('rs').classList.toggle('paused',run.phase==='paused');
}
function stop(){clearInterval(tickT);run=null;ppState='';clearTimeout(keepT);keepT=setTimeout(()=>{if(!run&&keepEl)keepEl.pause()},12000);unlock();$('rs').classList.remove('on','paused');paintTimer()}
function finish(full){
 if(!run)return;
 const now=Date.now();
 const sat=full?run.total:run.total-(run.phase==='paused'?run.left:Math.max(0,run.end-now));
 if(!full){killEndBus();ring(S.settings.endBell,1)}
 const min=Math.round(sat/60000);
 if(min>=1)addSession(dkey(new Date()),min,'Silent');
 stop();
 $('finMsg').textContent=MSGS[Math.floor(Math.random()*MSGS.length)];
 $('finSub').textContent=min>=1?`${min} minute${min>1?'s':''} added to your log`:'Under a minute, so nothing was logged';
 $('fin').classList.add('on');renderLog();
}
$('goBtn').onclick=()=>{if(!run)start()};
$('ppBtn').onclick=()=>{
 if(!run)return;
 if(run.phase==='count'){killEndBus();killStartBus();return stop()}
 if(run.phase==='sit'){run.left=run.end-Date.now();run.phase='paused';killEndBus();tick()}
 else{run.end=Date.now()+run.left;run.phase='sit';scheduleEnd(run.left/1000);tick()}
};
$('finishBtn').onclick=()=>finish(false);
$('discardBtn').onclick=()=>{if(!run)return;killEndBus();killStartBus();stop()};
$('finClose').onclick=()=>$('fin').classList.remove('on');
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){tick();if(run&&!wake)lock()}});

/* ---------- tabs ---------- */
function tab(t){const log=t==='log';$('tabTimer').setAttribute('aria-selected',!log);$('tabLog').setAttribute('aria-selected',log);$('vTimer').classList.toggle('on',!log);$('vLog').classList.toggle('on',log);if(log)renderLog()}
$('tabTimer').onclick=()=>tab('timer');$('tabLog').onclick=()=>tab('log');
$('streakT').onclick=()=>tab('log');

/* ---------- log ---------- */
let view=new Date();view.setDate(1);let period='month';let dayOpen=null;
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
function renderCal(){
 const m=byDay(),y=view.getFullYear(),mo=view.getMonth(),first=new Date(y,mo,1).getDay(),n=new Date(y,mo+1,0).getDate(),tk=dkey(new Date());
 $('mTitle').textContent=MONTHS[mo]+' '+y;
 let h='';for(let i=0;i<first;i++)h+='<span></span>';
 for(let d=1;d<=n;d++){const k=dkey(new Date(y,mo,d));const fut=k>tk;h+=`<button class="day${m[k]?' has':''}${k===tk?' now':''}" data-k="${k}" ${fut?'disabled':''} aria-label="${MONTHS[mo]} ${d}${m[k]?', sat':''}">${d}</button>`}
 $('days').innerHTML=h;
}
function inPeriod(k){
 const d=parse(k),t=new Date();t.setHours(0,0,0,0);
 if(period==='all')return true;
 if(period==='year')return d.getFullYear()===t.getFullYear();
 if(period==='month')return d.getFullYear()===t.getFullYear()&&d.getMonth()===t.getMonth();
 const s=new Date(t);s.setDate(t.getDate()-t.getDay());return d>=s&&d<=t;
}
function renderSum(){
 const cat=$('sumCat').value||'All';
 const list=S.sessions.filter(s=>inPeriod(s.date)&&(cat==='All'||s.cat===cat));
 const tot=list.reduce((a,s)=>a+s.min,0);
 $('sTotal').textContent=hm(tot);$('sCount').textContent=list.length;$('sAvg').textContent=(list.length?Math.round(tot/list.length):0)+' min';
 $('seg').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.p===period));
}
function fillCats(){
 const cur=$('sumCat').value||'All';
 $('sumCat').innerHTML=['All',...S.cats].map(c=>`<option${c===cur?' selected':''}>${c}</option>`).join('');
 $('addCat').innerHTML=S.cats.map(c=>`<option>${c}</option>`).join('')+'<option value="__new">Add new…</option>';
}
function renderLog(){fillCats();renderCal();renderSum();$('streakL').innerHTML=streakHTML()}
$('mPrev').onclick=()=>{view.setMonth(view.getMonth()-1);renderCal()};
$('mNext').onclick=()=>{view.setMonth(view.getMonth()+1);renderCal()};
$('seg').onclick=e=>{const b=e.target.closest('button');if(!b)return;period=b.dataset.p;renderSum()};
$('sumCat').onchange=renderSum;
function renderDay(){
 const d=parse(dayOpen);
 $('dayTitle').textContent=d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
 const list=S.sessions.filter(s=>s.date===dayOpen);
 $('dayList').innerHTML=list.map(s=>`<div class="row glass"><span>${s.min} min · ${s.cat}</span><button class="glass" data-id="${s.id}">Remove</button></div>`).join('');
}
$('days').onclick=e=>{const b=e.target.closest('.day');if(!b||b.disabled)return;dayOpen=b.dataset.k;fillCats();$('addMin').value='';$('newCat').hidden=true;renderDay();show('shDay')};
$('dayList').onclick=e=>{const b=e.target.closest('button[data-id]');if(!b)return;S.sessions=S.sessions.filter(s=>s.id!==b.dataset.id);save();renderDay();renderLog();paintTimer()};
$('addCat').onchange=()=>{const n=$('addCat').value==='__new';$('newCat').hidden=!n;if(n)$('newCat').focus()};
$('addForm').addEventListener('submit',e=>{
 e.preventDefault();const min=Math.round(+$('addMin').value);if(!(min>=1))return;
 let cat=$('addCat').value;
 if(cat==='__new'){cat=$('newCat').value.trim();if(!cat)return;if(!S.cats.includes(cat))S.cats.push(cat)}
 addSession(dayOpen,min,cat);$('addMin').value='';$('newCat').value='';$('newCat').hidden=true;
 fillCats();$('addCat').value=cat;renderDay();renderLog();paintTimer();
});

/* ---------- backup ---------- */
$('copyBk').onclick=async()=>{try{await navigator.clipboard.writeText(JSON.stringify(S));$('bkNote').textContent='Backup copied to the clipboard'}catch(e){$('bkText').value=JSON.stringify(S);$('bkText').select();$('bkNote').textContent='Copy the text above to keep it'}};
$('restoreBk').onclick=()=>{try{const d=JSON.parse($('bkText').value);if(!d||!Array.isArray(d.sessions))throw 0;S=Object.assign(JSON.parse(JSON.stringify(DEF)),d);S.settings=Object.assign({},DEF.settings,d.settings);save();paintTimer();renderLog();$('bkText').value='';$('bkNote').textContent=`Restored ${S.sessions.length} sessions`}catch(e){$('bkNote').textContent='That backup could not be read'}};

/* ---------- boot ---------- */
paintTimer();
requestAnimationFrame(()=>{const i=SOUNDS.findIndex(s=>s.id===S.settings.startBell);car.scrollLeft=Math.max(0,i)*STEP});
}
</script>
</body>
